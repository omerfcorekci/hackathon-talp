<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TALP Overview</title>
<link rel="stylesheet" href="/shell.css">
<style>
:root {
  --s-main: var(--accent); --s-second: #a9c6f5; --s-dormant: #ddd6c6; --s-left: var(--bad); --s-none: #f1f2f4;
  --code: #f6f7f9;
}
main { max-width: 1120px; margin: 0 auto; padding: 22px 24px 96px; }
button, select, input { font: inherit; color: var(--text); }
select, input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
pre { background: var(--code); border: 1px solid var(--line-soft); padding: 10px 12px; border-radius: 8px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 12px; max-height: 480px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
.ok { color: var(--good); } .no { color: var(--bad); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.spacer { flex: 1; }

/* section switcher */
.toprow { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: #eceef2; border-radius: 10px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { padding: 6px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.sm button { padding: 4px 12px; font-size: 13px; }
.ghost { color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
.ghost:hover { background: var(--hover); color: var(--text); }

h1 { font-size: 22px; font-weight: 650; margin: 0; }
.sec { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 36px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 13px; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.loading { color: var(--faint); padding: 40px 0; text-align: center; }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }

/* run head */
.runhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tag { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--line-soft); color: var(--muted); white-space: nowrap; }
.tag.acc { background: var(--accent-soft); color: var(--accent-text); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.good { background: var(--good-bg); color: var(--good); }
.meta { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* goal cards */
.goals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.goal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 10px; min-width: 0; }
.goal .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.goal .val { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 6px; }
.goal .val small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.goal .tgt { font-size: 12px; color: var(--faint); }
.goal svg { display: block; width: 100%; height: 34px; margin-top: 8px; }
.pill { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--good-bg); color: var(--good); } .pill.no { background: var(--bad-bg); color: var(--bad); }

/* decisions */
.decs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dec .hd { display: flex; align-items: baseline; gap: 8px; }
.dec .hd b.cost { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--accent-text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--hover); border: 1px solid var(--line-soft); }
.msg { margin: 8px 0; padding: 10px 12px; background: var(--code); border-radius: 8px; font-size: 13px; }
.why { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.budget { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.bbar { flex: 0 1 220px; height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
.bbar i { display: block; height: 100%; background: var(--good); }
.bbar i.over { background: var(--bad); }

/* charts */
svg text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
svg .axis { stroke: var(--line-soft); }
svg .mark { stroke: var(--faint); stroke-dasharray: 3 4; }
svg .mark.dec { stroke: var(--accent); stroke-dasharray: 5 3; opacity: .7; }
svg text.ml { font-size: 10.5px; }
svg text.ml.dec { fill: var(--accent-text); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; margin-bottom: 6px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 6px; }
.legend i.sq { height: 12px; vertical-align: -1px; border-radius: 3px; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; }
.evs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ev { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); text-align: left; }
.ev b { color: var(--muted); font-weight: 600; margin-right: 4px; }
.ev.dec { border-color: var(--accent); color: var(--accent-text); }
button.ev:hover { background: var(--hover); }
.stack > .card + .card { margin-top: 12px; }

/* tables */
.tw { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); max-width: 100%; }
.tw.tall { max-height: 70vh; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { position: sticky; top: 0; background: var(--panel); font-weight: 600; font-size: 12px; color: var(--muted); white-space: nowrap; z-index: 2; border-bottom: 1px solid var(--line); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
tr.hl td { background: #f5f9ff; }

/* persona grid */
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input[type=search] { width: 260px; }
table.pg { width: auto; }
table.pg th, table.pg td { padding: 0; border: 0; }
table.pg th { padding: 8px 0 6px; text-align: center; font-variant-numeric: tabular-nums; }
table.pg th.ev { color: var(--text); }
table.pg th.ev::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 2px auto 0; }
table.pg .pname { position: sticky; left: 0; background: var(--panel); z-index: 1; text-align: left; padding: 0 12px 0 14px; white-space: nowrap; }
table.pg th.pname { z-index: 3; }
table.pg tr.grp td { padding: 16px 14px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
table.pg tr.grp td span.gh { position: sticky; left: 14px; }
.plink { text-align: left; padding: 3px 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: block; }
.plink:hover .nm { color: var(--accent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.cell { display: block; width: 38px; height: 24px; margin: 2px; border-radius: 6px; font-size: 11px; line-height: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.cell:hover { outline: 2px solid var(--text); outline-offset: -1px; }
.s-main { background: var(--s-main); color: #fff; } .s-second { background: var(--s-second); color: #17365f; }
.s-dormant { background: var(--s-dormant); color: #4a4538; } .s-left { background: var(--s-left); color: #fff; }
.s-none { background: var(--s-none); color: var(--faint); }
.hide { display: none !important; }

/* side panel */
#scrim { position: fixed; inset: 56px 0 0 0; background: rgba(29, 33, 37, .18); z-index: 39; opacity: 0; pointer-events: none; transition: opacity .15s; }
#scrim.open { opacity: 1; pointer-events: auto; }
#panel { position: fixed; top: 56px; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(29,33,37,.08); z-index: 40; transform: translateX(100%); transition: transform .18s ease; display: flex; flex-direction: column; visibility: hidden; }
#panel.open { transform: none; visibility: visible; }
#panel .phead { display: flex; justify-content: flex-end; padding: 10px 12px 0; }
#panel .x { width: 34px; height: 34px; border-radius: 8px; font-size: 18px; color: var(--muted); }
#panel .x:hover { background: var(--hover); color: var(--text); }
#pbody { overflow: auto; padding: 0 26px 48px; flex: 1; }
#pbody h2 { font-size: 20px; margin: 2px 0 2px; font-weight: 650; }
#pbody h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
.pfacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 16px 0; }
.pfacts div { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.pfacts .k { font-size: 11.5px; color: var(--muted); } .pfacts .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.narr { line-height: 1.6; }
.quote { color: var(--muted); font-style: italic; border-left: 3px solid var(--line); padding-left: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 12.5px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.wk { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.wk .n { font-weight: 650; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 1px; }
.wk.focus { background: var(--accent-soft); margin: 0 -12px; padding: 12px; border-radius: 10px; border-bottom-color: transparent; }
.wk.focus .n { color: var(--accent-text); }
.wk p { margin: 6px 0; }
.wk .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.st { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.said { font-size: 12.5px; color: var(--muted); margin: 4px 0; }
.said b { color: var(--text); font-weight: 600; }
.linkbtn { color: var(--accent); font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }
.probe td, .probe th { padding: 6px 8px; }
.callh { font-size: 12.5px; font-weight: 600; margin: 12px 0 2px; }

/* markdown */
.md { line-height: 1.6; }
.md h2 { font-size: 18px; } .md h3 { font-size: 15px; margin-top: 24px; } .md h4 { font-size: 14px; }
.md table { width: auto; }
.md th { position: static; }
.md blockquote { margin: 8px 0; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }

@media (max-width: 900px) {
  .goals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .decs { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  main { padding: 16px 16px 80px; }
  .toprow { margin-bottom: 18px; }
  .toprow { gap: 6px; }
  .seg button { padding: 6px 9px; font-size: 13.5px; }
  .ghost .t { display: none; }
  .goal { padding: 12px 12px 8px; }
  .goal .val { font-size: 24px; }
  #pbody { padding: 0 16px 40px; }
  .toolbar input[type=search] { width: 100%; }
  .cell { width: 30px; }
  .plink { max-width: 130px; }
}
</style>
</head>
<body>
<main>
  <div class="toprow"><div class="seg" id="nav"></div><span class="spacer"></span><button class="ghost" data-act="refresh" title="Reload the files">↻<span class="t"> Refresh</span></button></div>
  <div id="body"><div class="loading">Loading…</div></div>
</main>
<div id="scrim" data-act="close"></div>
<aside id="panel" aria-hidden="true"><div class="phead"><button class="x" data-act="close" title="Close (Esc)">✕</button></div><div id="pbody"></div></aside>
<script src="/shell.js"></script>
<script>
"use strict";
// ------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = encodeURIComponent;
const cache = new Map();
function api(path) {
  if (cache.has(path)) return cache.get(path);
  const p = fetch(path, { cache: "no-store" }).then(async (r) => {
    const j = await r.json().catch(() => ({ error: "bad JSON" }));
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  });
  cache.set(path, p);
  p.catch(() => cache.delete(path));
  return p;
}
const runApi = (id) => api(`/api/run?id=${enc(id)}`);
const fmtNum = (v, d = 0) => v == null || v === "" || Number.isNaN(+v) ? "–" : Number(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtUsd = (v) => v == null ? "–" : "$" + (Math.abs(v) >= 1e9 ? fmtNum(v / 1e9, 2) + "B" : Math.abs(v) >= 1e5 ? fmtNum(v / 1e6, 2) + "M" : Math.abs(v) >= 1e4 ? fmtNum(v / 1e3, 0) + "k" : fmtNum(v));
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const shortId = (id) => String(id || "").replace(/^(runs|experiments)\//, "");

// key, label, unit, decimals, higher-is-better
const GOALS = [
  ["goal_1", "Active customers", "%", 2, true],
  ["goal_2", "Deposits", "%", 2, true],
  ["goal_3", "App Store rating", "★", 2, true],
  ["goal_3b", "CFPB complaints / month", "", 0, false],
];
const DEFAULT_TARGETS = { goal_1: ">= 98", goal_2: ">= 97", goal_3: ">= 4.3", goal_3b: "<= 240" };
function goalOk(key, v, targets) {
  if (v == null) return null;
  const m = /^(>=|<=)\s*([\d.]+)/.exec(((targets || {})[key] || DEFAULT_TARGETS[key]) || "");
  if (!m) return null;
  return m[1] === ">=" ? v >= +m[2] : v <= +m[2];
}
const tgtText = (t, k) => String(((t || {})[k] || DEFAULT_TARGETS[k]) || "").replace(">=", "≥").replace("<=", "≤");
const tgtNum = (t, k) => { const m = /([\d.]+)/.exec(((t || {})[k] || DEFAULT_TARGETS[k]) || ""); return m ? +m[1] : null; };
const okCls = (o) => o == null ? "" : o ? "ok" : "no";

const PROBE_Q = {
  "1a": ["Trust", "How much do you trust Cobalt Bank?"],
  "1b": ["Treats me right", "\"I can count on Cobalt Bank to treat me right.\""],
  "2a": ["Intent to stay", "How likely are you to keep using Cobalt Bank over the next three months?"],
  "2b": ["Thinking of leaving", "\"I am thinking about leaving Cobalt Bank.\"", true],
  "3a": ["Recommend", "How likely are you to recommend Cobalt Bank to a friend or colleague?"],
  "3b": ["What they would tell a friend", "If a friend asked you about Cobalt Bank today, what would you tell them?"],
  "4a": ["Fairness", "How fairly has Cobalt Bank treated you?"],
  "4b": ["Takes advantage", "\"Cobalt Bank takes advantage of people like me.\"", true],
};
const GROUP_TR = { "everyday customers": "Everyday customers", "paycheck customers": "Paycheck customers", "savers with large balances": "Savers with large balances", "small business owners with a Cobalt card reader": "Small businesses with a card reader", "students": "Students" };
const groupTr = (g) => GROUP_TR[g] || g || "–";
const STATUSES = ["main bank", "second bank", "dormant", "left"];
const STATUS_TR = { "main bank": "main bank", "second bank": "second bank", dormant: "dormant", left: "left" };
const stc = (s) => ({ "main bank": "s-main", "second bank": "s-second", dormant: "s-dormant", left: "s-left" }[s] || "s-none");
const MONEY_TR = { kept: "kept", "moved some": "moved some", "moved most": "moved most" };
const MONEY_MARK = { kept: "", "moved some": "↓", "moved most": "↓↓" };
const NEW_TR = { some: "some new money", "a lot": "a lot of new money" };
const MOOD_TR = { calm: "calm", hopeful: "hopeful", relieved: "relieved", worried: "worried", frustrated: "frustrated", angry: "angry" };
const TYPE_TR = { plan: "Plan · our decisions", nodecision: "No decision · business as usual", plan_nosurprises: "Plan · no surprises" };
const groupsOf = (personas) => { const g = []; personas.forEach((p) => { if (!g.includes(p.group)) g.push(p.group); }); return g; };
const gcol = (i) => `var(--g${(i % 5) + 1})`;
const indexWeekly = (weekly) => { const m = {}; (weekly || []).forEach((r) => { (m[r.persona] ||= {})[r.week] = r; }); return m; };
const targetText = (t) => t == null ? "–" : typeof t === "string" ? (t === "everyone" ? "everyone" : t) : JSON.stringify(t);
const shortAction = (a) => String(a.action || "").replace(" during the migration", "").replace(" to other banks", "").replace(", new money only", " (new money)") + (a.level && a.level !== "on" ? ` · ${a.level}` : "");
const whyLines = (w) => (Array.isArray(w) ? w : String(w || "").split("\n")).map((x) => String(x).trim()).filter(Boolean);
const lastWeekOf = (weekly) => Math.max(0, ...(weekly || []).map((r) => r.week || 0));

// ------------------------------------------------------------ state + routing
// Hash = what is on screen: #overview, #personas/P1/5, #compare/<a>/<b>, #records/calls/<call>.
// Every change uses replaceState: switching or closing never adds browser history.
const S = { run: null, sec: "overview", arg: [], data: null, sweep: null, q: "", lf: { persona: "", week: "", failed: false, q: "" }, panelBase: null, width: 0 };
const SECTIONS = [["overview", "Overview"], ["personas", "Personas"], ["compare", "Compare"], ["records", "Records"]];
const VIEWS = {};
const readHash = () => { const raw = location.hash.replace(/^#\/?/, ""); return raw ? raw.split("/").map((x) => { try { return decodeURIComponent(x); } catch { return x; } }) : []; };
function setHash(parts) {
  const h = "#" + parts.filter((x) => x != null && x !== "").map((x) => enc(String(x))).join("/");
  if (location.hash !== h) history.replaceState(null, "", h);
}
function go(parts, keepScroll = false) { setHash(parts); render(keepScroll); }

let renderToken = 0;
async function render(keepScroll = false) {
  const parts = readHash();
  S.sec = VIEWS[parts[0]] ? parts[0] : "overview";
  S.arg = parts.slice(1);
  $("#nav").innerHTML = SECTIONS.map(([k, t]) => `<button class="${k === S.sec ? "on" : ""}" data-act="sec" data-sec="${k}">${t}</button>`).join("");
  hidePanel();
  const t = ++renderToken, y = window.scrollY;
  const body = $("#body");
  const slow = setTimeout(() => { if (t === renderToken) body.innerHTML = `<div class="loading">Loading…</div>`; }, 160);
  try {
    let out = await VIEWS[S.sec]();
    if (t !== renderToken) return;
    clearTimeout(slow);
    if (typeof out === "string") out = [out];
    body.innerHTML = out[0];
    S.width = body.clientWidth;
    window.scrollTo(0, keepScroll ? y : 0);
    if (out[1]) out[1]();
  } catch (e) {
    clearTimeout(slow);
    if (t === renderToken) body.innerHTML = `<div class="err">Error: ${esc(e.message)}</div>`;
  }
}
const noRun = () => `<div class="card empty">No runs yet.<br><span class="small">A run shows up here once a folder with a run.json exists under runs/ or experiments/.</span></div>`;

// ------------------------------------------------------------ side panel
let panelToken = 0;
function showPanel(html, hashParts, baseParts) {
  const p = $("#panel");
  $("#pbody").innerHTML = html;
  $("#pbody").scrollTop = 0;
  p.classList.add("open"); p.setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open");
  S.panelBase = baseParts || null;
  if (hashParts) setHash(hashParts);
  return ++panelToken;
}
function hidePanel() {
  $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("open");
  panelToken++;
}
function closePanel() {
  if (!$("#panel").classList.contains("open")) return;
  hidePanel();
  if (S.panelBase) setHash(S.panelBase);
  S.panelBase = null;
}
const fillPanel = (t, html) => { if (t === panelToken) $("#pbody").innerHTML = html; return t === panelToken; };

// ------------------------------------------------------------ charts (inline SVG)
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
const chartW = () => Math.round(Math.max(300, Math.min(1060, ($("#body").clientWidth || 800) - 38)));
function weekMarkers(announcements, decisions) {
  const m = {};
  const add = (w, label, dec) => { w = +w; if (!(w >= 1 && w <= 10)) return; (m[w] ||= { labels: [], dec: false }).labels.push(label); if (dec) m[w].dec = true; };
  add(6, "Migration");
  (announcements || []).forEach((a) => add(a.week, annTitle(a)));
  (decisions || []).forEach((d, i) => add(d.week, `Decision ${i + 1}`, true));
  return m;
}
function markerSvg(markers, xs, top, bottom, W) {
  let g = "", k = 0;
  const maxCh = 22, labels = W >= 560;  // narrow charts: lines only, the chips below name the events
  for (const [w, mk] of Object.entries(markers)) {
    const row = k++ % 2, x = xs(+w), end = +w >= 8;
    g += `<line class="mark ${mk.dec ? "dec" : ""}" x1="${x}" x2="${x}" y1="${top - 4}" y2="${bottom}"><title>Week ${esc(w)}: ${esc(mk.labels.join(" · "))}</title></line>`;
    if (!labels) continue;
    const lb = mk.labels.join(" · ");
    g += `<text class="ml ${mk.dec ? "dec" : ""}" x="${x + (end ? -4 : 4)}" y="${10 + row * 12}" text-anchor="${end ? "end" : "start"}">${esc(lb.length > maxCh ? lb.slice(0, maxCh - 1) + "…" : lb)}</text>`;
  }
  return g;
}
// series: [{name, color, points:[[week, y]], dash}], targets: [{v, color, label}]
function lineChart({ series, targets = [], markers = null, unit = "", height = 250, W = chartW() }) {
  const H = height, L = 44, R = 14, T = markers && W >= 560 ? 32 : 14, B = 24;
  const xs = (w) => L + (w - 1) * (W - L - R) / 9;
  const all = series.flatMap((s) => s.points.map((p) => p[1])).filter((v) => v != null).concat(targets.map((t) => t.v).filter((v) => v != null));
  if (!series.some((s) => s.points.some((p) => p[1] != null))) return `<div class="muted small" style="padding:30px 0;text-align:center">No weekly data.</div>`;
  let yMin = Math.min(...all), yMax = Math.max(...all);
  if (yMax - yMin < 1e-9) { yMin -= 1; yMax += 1; }
  const step = niceStep((yMax - yMin) / 4);
  yMin = Math.floor(yMin / step) * step; yMax = Math.ceil(yMax / step) * step;
  const ys = (v) => T + (yMax - v) * (H - T - B) / (yMax - yMin);
  const dec = step < 0.1 ? 2 : step < 1 ? 1 : 0;
  let g = "";
  for (let v = yMin; v <= yMax + step / 2; v += step) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${fmtNum(v, dec)}</text>`;
  for (let w = 1; w <= 10; w++) g += `<text x="${xs(w)}" y="${H - 6}" text-anchor="middle">${w}</text>`;
  if (markers) g += markerSvg(markers, xs, T, H - B, W);
  for (const t of targets) if (t.v != null) g += `<line x1="${L}" x2="${W - R}" y1="${ys(t.v)}" y2="${ys(t.v)}" stroke="${t.color}" stroke-dasharray="2 4" stroke-width="1.5" opacity=".8"/><text x="${W - R}" y="${ys(t.v) - 4}" text-anchor="end" style="fill:${t.color}">${esc(t.label)}</text>`;
  for (const s of series) {
    const pts = s.points.filter((p) => p[1] != null);
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 2.25}" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="6 4"' : ""} points="${pts.map((p) => `${xs(p[0])},${ys(p[1])}`).join(" ")}"/>`;
    g += pts.map((p) => `<circle cx="${xs(p[0])}" cy="${ys(p[1])}" r="3" fill="${s.color}"><title>${esc(s.name)} · week ${p[0]}: ${fmtNum(p[1], 2)}${unit}</title></circle>`).join("");
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
const legend = (items) => `<div class="legend">${items.map((s) => `<span style="color:${s.color}"><i class="${s.sq ? "sq" : ""} ${s.dash ? "dash" : ""}" style="background:${s.color}"></i><span style="color:var(--muted)">${esc(s.name)}</span></span>`).join("")}</div>`;
function statusBars(weekly, W = chartW()) {
  const H = 190, L = 34, R = 14, T = 10, B = 24;
  const weeks = Array.from({ length: 10 }, (_, i) => { const o = {}; weekly.filter((r) => r.week === i + 1).forEach((r) => { o[r.status] = (o[r.status] || 0) + 1; }); return o; });
  const max = Math.max(1, ...weeks.map((w) => STATUSES.reduce((s, k) => s + (w[k] || 0), 0)));
  const bw = (W - L - R) / 10, ys = (v) => T + (max - v) * (H - T - B) / max;
  const colors = ["--s-main", "--s-second", "--s-dormant", "--s-left"].map(cssVar);
  let g = "";
  const st = niceStep(max / 3);
  for (let v = 0; v <= max + 1e-9; v += st) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  weeks.forEach((w, i) => {
    let acc = 0; const x = L + i * bw + bw * 0.2;
    STATUSES.forEach((k, j) => { const v = w[k] || 0; if (!v) return; g += `<rect x="${x}" width="${bw * 0.6}" y="${ys(acc + v)}" height="${Math.max(0, ys(acc) - ys(acc + v) - 1)}" rx="2" fill="${colors[j]}"><title>Week ${i + 1} · ${STATUS_TR[k]}: ${v}</title></rect>`; acc += v; });
    g += `<text x="${x + bw * 0.3}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`;
  });
  return legend(STATUSES.map((k, j) => ({ name: STATUS_TR[k], color: colors[j], sq: true }))) + `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
function spark(points, target, ok) {
  const pts = points.filter((p) => p[1] != null);
  if (pts.length < 2) return "";
  const W = 200, H = 34, P = 3;
  const vals = pts.map((p) => p[1]).concat(target != null ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const xs = (w) => P + (w - 1) * (W - 2 * P) / 9, ys = (v) => P + (hi - v) * (H - 2 * P) / (hi - lo);
  const col = ok == null ? "var(--accent)" : ok ? "var(--good)" : "var(--bad)";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    ${target != null ? `<line x1="0" x2="${W}" y1="${ys(target)}" y2="${ys(target)}" stroke="var(--faint)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>` : ""}
    <polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${pts.map((p) => `${xs(p[0])},${ys(p[1])}`).join(" ")}"/></svg>`;
}

function annTitle(a) {
  const m = /\*\*(.+?)\*\*/.exec(a.text || "");
  if (m) return m[1].replace(/[.:]$/, "");
  if (/update/i.test(a.id || "")) return "Update";
  return a.title || a.id || "Announcement";
}
function runHead(rj, d, id) {
  const tags = [`<span class="tag acc">${esc(TYPE_TR[rj.type] || rj.type || "?")}</span>`];
  if (d.fake) tags.push(`<span class="tag warn">fake model</span>`);
  if (rj.complete === false) tags.push(`<span class="tag bad">incomplete · ${esc(rj.completed_weeks ?? "?")} weeks</span>`);
  return `<div class="runhead"><h1>${esc(shortId(id))}</h1>${tags.join("")}</div>
    <div class="meta">seed ${esc(rj.seed)} · ${esc(rj.model || "?")} · ${d.personas.length} personas · surprises ${rj.type === "plan_nosurprises" ? "off" : "on"}</div>`;
}
function goalCards(d) {
  const m = d.metrics || {}, wm = (d.weekly_metrics || {}).weeks || [];
  return `<div class="goals">${GOALS.map(([k, label, unit, dd]) => {
    const v = m[k], ok = goalOk(k, v, d.targets);
    const pill = ok == null ? "" : `<span class="pill ${ok ? "ok" : "no"}">${ok ? "✓ met" : "✗ missed"}</span>`;
    return `<div class="goal"><div class="top"><span>${label}</span>${pill}</div>
      <div class="val ${okCls(ok)}">${fmtNum(v, dd)}<small>${unit}</small></div>
      <div class="tgt">target ${esc(tgtText(d.targets, k))}</div>
      ${spark(wm.map((w) => [w.week, w[k] ?? null]), tgtNum(d.targets, k), ok)}</div>`;
  }).join("")}</div>`;
}
function decCards(decisions, budget) {
  if (!decisions || !decisions.length) return `<div class="card muted">No decisions: business as usual.</div>`;
  const b = budget || {};
  const cards = decisions.map((dec, i) => {
    const bd = (b.decisions || [])[i] || {};
    const why = whyLines(dec.why);
    return `<div class="card dec"><div class="hd"><span class="eyebrow">Decision ${i + 1}</span><b>Week ${esc(dec.week)}</b><span class="spacer"></span><b class="cost">${fmtUsd(bd.total)}</b></div>
      <div class="chips">${(dec.actions || []).map((a) => `<span class="chip">${esc(shortAction(a))}</span>`).join("")}${bd.sms_sends ? `<span class="chip">SMS × ${bd.sms_sends}</span>` : ""}</div>
      <div class="small muted">Target: ${esc(targetText(dec.target))} · ${esc((dec.channels || []).join(", "))}</div>
      <details style="margin-top:8px"><summary>Message and reasoning</summary><div class="msg">${esc(dec.message)}</div><div class="small faint">${(dec.message || "").length} characters</div>${why.length ? `<ul class="why">${why.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</details></div>`;
  }).join("");
  let foot = "";
  if (b.available && b.total != null) {
    const over = b.total > b.limit;
    foot = `<div class="budget"><span>Total <b class="${over ? "no" : ""}" style="color:var(--text)">${fmtUsd(b.total)}</b> / ${fmtUsd(b.limit)} budget</span><div class="bbar"><i class="${over ? "over" : ""}" style="width:${Math.min(100, b.total / b.limit * 100).toFixed(1)}%"></i></div></div>`;
  } else if (b.error) foot = `<div class="small faint" style="margin-top:8px">Budget could not be computed: ${esc(b.error)}</div>`;
  return `<div class="decs">${cards}</div>${foot}`;
}
function eventChips(announcements, decisions) {
  const items = [{ w: 6, html: `<button class="ev" data-act="crisis"><b>Wk 6</b>Migration: app read-only for 36 hours</button>` }];
  (announcements || []).forEach((a, i) => items.push({ w: +a.week, html: `<button class="ev" data-act="ann" data-i="${i}"><b>Wk ${esc(a.week)}</b>${esc(annTitle(a))}</button>` }));
  (decisions || []).forEach((d, i) => items.push({ w: +d.week, html: `<span class="ev dec"><b>Wk ${esc(d.week)}</b>Decision ${i + 1} starts</span>` }));
  items.sort((a, b) => a.w - b.w);
  return `<div class="evs">${items.map((x) => x.html).join("")}</div>`;
}
const CRISIS_TEXT = `**Known crisis: core banking migration.** Saturday Dec 12 00:00 → Sunday Dec 13 12:00 CT. For 36 hours the app is read-only: balances are visible; no transfers, no P2P, no new cards. Card payments work offline, up to $100 per payment. The switch may overrun by "some hours"; nobody knows how many. Rivals know the date. Many paycheck customers are paid on Friday Dec 11.`;

function filterPersonas(q) {
  q = (q || "").trim().toLowerCase();
  const seen = new Set();
  document.querySelectorAll("table.pg tr.pr").forEach((tr) => { const on = !q || tr.dataset.s.includes(q); tr.classList.toggle("hide", !on); if (on) seen.add(tr.dataset.g); });
  document.querySelectorAll("table.pg tr.grp").forEach((tr) => tr.classList.toggle("hide", !seen.has(tr.dataset.g)));
}

async function openPersona(runId, pid, week, inHash) {
  const t = showPanel(`<div class="loading">Loading…</div>`, inHash ? ["personas", pid, week || ""] : null, inHash ? ["personas"] : null);
  try {
    const d = await runApi(runId);

function personaHtml(d, runId, pid, week) {
  const p = d.personas.find((x) => x.id === pid);
  if (!p) return `<div class="err">Persona not in this run: ${esc(pid)}</div>`;
  const gi = groupsOf(d.personas).indexOf(p.group);

    <h2>${esc(p.name || pid)}</h2><div class="muted small">${esc(sub)}</div>
    <div class="pfacts">${fact("Represents", p.weight_customers != null ? fmtNum(p.weight_customers) + " customers" : null)}${fact("Deposit share", p.weight_deposits_usd != null ? fmtUsd(p.weight_deposits_usd) : null)}${fact("Balance", p.balance_usd != null ? fmtUsd(p.balance_usd) : null)}${fact("Nov 2", p.cobalt_role ? esc(STATUS_TR[p.cobalt_role] || p.cobalt_role) : null)}</div>
    ${p.narrative ? `<p class="narr">${esc(p.narrative)}</p>` : ""}${p.voice ? `<p class="quote">“${esc(p.voice)}”</p>` : ""}`;
  // check-in probe
  const probe = (d.probe || []).filter((r) => r.persona === pid);
  if (probe.length) {
    const pv = (when, q) => { const r = probe.find((x) => x.when === when && x.question === q); return r ? r.score : null; };
    h += `<h3>Check-in · start → end</h3><table class="probe"><tbody>${Object.entries(PROBE_Q).map(([q, [lbl, txt, rev]]) => {
      const a = pv("start", q), b = pv("end", q), dl = a != null && b != null ? b - a : null;
      const cls = dl == null || dl === 0 ? "faint" : (dl > 0) !== !!rev ? "ok" : "no";
      return `<tr><td class="small" title="${esc(txt)}">${esc(lbl)}${rev ? ` <span class="faint">(reversed)</span>` : ""}</td><td class="num">${a ?? "–"} → <b>${b ?? "–"}</b></td><td class="num ${cls}" style="width:40px">${dl == null || dl === 0 ? "·" : (dl > 0 ? "+" : "") + dl}</td></tr>`;
    }).join("")}</tbody></table><div class="small faint" style="margin-top:4px">Scores 1–5. On reversed questions a high score is bad.</div>`;
  }
  // week by week
  h += `<h3>Week by week</h3>`;
  for (let w = 1; w <= 10; w++) {

    h += `<div class="wk ${w === week ? "focus" : ""}" id="wk-${w}"><div class="n">${w}</div><div>
      <div class="top">${bits.join("")}</div>
      <p>${esc(r.reason)}</p>
      ${heard.map((m) => `<div class="said">← <b>${esc(nm(m.author))}</b>: ${esc(m.text)}</div>`).join("")}

      ${ids.length ? `<button class="linkbtn" data-act="call" data-run="${esc(runId)}" data-ids="${esc(ids.join(","))}">Show model answer</button><div class="callbox"></div>` : ""}
    </div></div>`;
  }
  const skip = new Set(["id", "name", "group", "narrative", "voice"]);
  const other = Object.entries(p).filter(([k]) => !skip.has(k));
  h += `<details style="margin-top:22px"><summary>All profile fields (${other.length})</summary><div class="kv" style="margin-top:10px">${other.map(([k, v]) => `<div>${esc(k.replace(/_/g, " "))}</div><div>${esc(typeof v === "object" && v !== null ? JSON.stringify(v) : v)}</div>`).join("")}</div></details>

}

function defaultPair() {
  const runs = (window.TALP && TALP.runs) || [];
  const has = (id) => runs.some((r) => r.id === id);
  const byId = (id) => runs.find((r) => r.id === id);
  const dir = (id) => String(id).split("/").slice(0, -1).join("/");
  const counterpart = (id, want) => {
    const r = byId(id); if (!r) return null;
    const seg = id.split("/").pop();
    const guess = dir(id) + "/" + (want === "nodecision" ? seg.replace(/^plan(_nosurprises)?/, "nodecision") : seg.replace(/^nodecision/, "plan"));
    if (guess !== id && has(guess) && byId(guess).type === want) return guess;
    const same = runs.filter((x) => x.type === want && dir(x.id) === dir(id));
    return ((same.find((x) => x.seed === r.seed) || same[0] || runs.find((x) => x.type === want)) || {}).id || null;
  };
  const cur = byId(S.run);
  if (cur && cur.type === "nodecision") return [counterpart(cur.id, "plan"), cur.id];
  if (cur) return [cur.id, counterpart(cur.id, "nodecision")];
  return [(runs.find((r) => r.type === "plan") || {}).id, (runs.find((r) => r.type === "nodecision") || {}).id];
}
function fmtDelta(k, v) {
  if (v == null) return "–";

  return (v > 0 ? "+" : v < 0 ? "−" : "±") + fmtNum(Math.abs(v), d) + (k === "goal_1" || k === "goal_2" ? " pts" : "");
}

function inlineMd(s) {
  let t = esc(s);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, href) => /^https?:/.test(href) ? `<a href="${href}" target="_blank" rel="noopener noreferrer">${txt}</a>` : `${txt} <span class="muted small">(${href})</span>`);
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let out = "", i = 0;
  const isTable = (l) => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(l);
    if (h) { const n = Math.min(h[1].length + 1, 6); out += `<h${n}>${inlineMd(h[2])}</h${n}>`; i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (isTable(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const hd = cells(l); i += 2; const body = [];
      while (i < lines.length && isTable(lines[i])) body.push(cells(lines[i++]));
      out += `<div class="tw" style="margin:10px 0"><table><thead><tr>${hd.map((c) => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, "")); out += `<blockquote>${md(buf.join("\n"))}</blockquote>`; continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d+[.)]/.test(l); const items = [];
      while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
        if (m) items.push({ ind: m[1].length, text: m[3] }); else items[items.length - 1].text += " " + lines[i].trim();
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out += `<${tag}>${items.map((it) => `<li style="margin-left:${Math.floor(it.ind / 2) * 18}px">${inlineMd(it.text)}</li>`).join("")}</${tag}>`;
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i]) && !isTable(lines[i])) buf.push(lines[i++]);
    out += `<p>${inlineMd(buf.join(" "))}</p>`;
  }
  return out;
}

// ------------------------------------------------------------ events
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "close") closePanel();
  else if (act === "sec") go([el.dataset.sec]);
  else if (act === "refresh") { cache.clear(); render(true); }
  else if (act === "persona") openPersona(el.dataset.run || S.run, el.dataset.pid, +el.dataset.w || null, S.sec === "personas" && !el.dataset.run);
  else if (act === "call") toggleCall(el);
  else if (act === "crisis") showPanel(`<div class="small muted">Week 6 · Dec 7–13</div><div class="md">${md(CRISIS_TEXT)}</div>`);
  else if (act === "ann") {
    const a = ((S.data || {}).announcements || [])[+el.dataset.i]; if (!a) return;
    showPanel(`<div class="small muted">Week ${esc(a.week)} · dashboard announcement</div><h2>${esc(annTitle(a))}</h2><div class="md">${md(a.text)}</div>${a.published_at ? `<div class="small faint">Published: ${esc(a.published_at)}</div>` : ""}`);
  }
  else if (act === "variant") variantPanel(el.dataset.v);
  else if (act === "setrun") { hidePanel(); setHash(["overview"]); if (window.TALP) TALP.setRun(el.dataset.id); }
  else if (act === "sub") go(["records", el.dataset.sub]);
  else if (act === "doc") go(["records", "docs", el.dataset.doc], true);
  else if (act === "logcall") callPanel(S.run, el.dataset.id);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.cmp) {
    const a = $('[data-cmp="a"]').value, b = $('[data-cmp="b"]').value;
    if (a && b) go(["compare", a, b], true);
  } else if (t.dataset.sweep != null && t.matches("select[data-sweep]")) { S.sweep = t.value; render(true); }
  else if (t.dataset.lf) { S.lf[t.dataset.lf] = t.type === "checkbox" ? t.checked : t.value; render(true); }
});
document.addEventListener("input", (e) => { if (e.target.id === "pq") { S.q = e.target.value; filterPersonas(S.q); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePanel();
  if (e.key === "Enter" && e.target.id === "lq") { S.lf.q = e.target.value; render(true); }
});
window.addEventListener("hashchange", () => render());
let resizeT = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const w = $("#body").clientWidth;
    if ((S.sec === "overview" || S.sec === "compare") && Math.abs(w - S.width) > 60) render(true);
  }, 200);
});
window.addEventListener("talp:run", (e) => {
  S.run = e.detail.run;
  S.lf = { persona: "", week: "", failed: false, q: "" };
  if (S.sec === "compare" || S.sec === "personas") setHash([S.sec]);
  else if (S.sec === "records") setHash(["records", S.arg[0] || "calls"]);
  render();
});
(window.TALP ? TALP.ready : Promise.resolve({ run: null })).then(({ run }) => { S.run = run; render(); });
</script>
</body>
