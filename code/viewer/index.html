<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TALP Viewer</title>
<style>
:root {
  --bg: #fbfbfc; --panel: #ffffff; --text: #1f2328; --muted: #6a7079; --faint: #9aa0a8;
  --line: #e7e9ec; --line-soft: #f0f1f3; --hover: #f5f7fa;
  --accent: #2f6fde; --accent-soft: #eaf1fd; --accent-text: #1d4fa8;
  --good: #1f7a4d; --good-bg: #e8f5ee; --bad: #b4372c; --bad-bg: #fcebea; --warn: #8a5a00; --warn-bg: #fff6e0;
  --code: #f6f7f9;
  --s-main: #4a7fd8; --s-second: #b9d1f3; --s-dormant: #e3dfd4; --s-left: #e0675a; --s-none: #f1f2f4;
  --s-main-t: #fff; --s-second-t: #17365f; --s-dormant-t: #4a4538; --s-left-t: #fff;
  --c1: #2f6fde; --c2: #e08a2e;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
pre { background: var(--code); border: 1px solid var(--line-soft); padding: 10px 12px; border-radius: 8px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 12px; max-height: 520px; }
header { position: sticky; top: 0; height: 56px; display: flex; align-items: center; gap: 28px; padding: 0 28px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 20; }
header .brand { font-weight: 700; letter-spacing: .02em; }
header nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
header nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
header nav a:hover { background: var(--hover); color: var(--text); text-decoration: none; }
header nav a.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
main { max-width: 1240px; margin: 0 auto; padding: 32px 28px 80px; }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 16px; margin: 40px 0 12px; font-weight: 650; }
h3 { font-size: 14px; margin: 16px 0 8px; font-weight: 650; }
.lead { color: var(--muted); margin: 0 0 24px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
button, select, input[type=text], input[type=search] { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
button { cursor: pointer; }
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent-text); }
button.ghost { border-color: transparent; color: var(--muted); }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 16px; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 20px 0 24px; flex-wrap: wrap; }
.tabs a { padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a:hover { text-decoration: none; color: var(--text); }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.tablewrap.tall { max-height: 70vh; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { position: sticky; top: 0; background: var(--panel); font-weight: 600; font-size: 12px; color: var(--muted); z-index: 2; white-space: nowrap; border-bottom: 1px solid var(--line); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 18px; background: var(--line-soft); color: var(--muted); white-space: nowrap; }
.badge.good { background: var(--good-bg); color: var(--good); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.accent { background: var(--accent-soft); color: var(--accent-text); }
.g-good { color: var(--good); }
.g-bad { color: var(--bad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.metric .k { font-size: 12.5px; color: var(--muted); }
.metric .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0; }
.metric .t { font-size: 12px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; }
.kv > div:nth-child(odd) { color: var(--muted); font-size: 12.5px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 13px; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
details { margin: 8px 0; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
/* recommendation */
.rec { border: 1px solid var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--panel) 70%); border-radius: 16px; padding: 24px 26px; }
.rec .eyebrow { font-size: 12px; font-weight: 600; color: var(--accent-text); letter-spacing: .04em; text-transform: uppercase; }
.rec .title { font-size: 24px; font-weight: 700; margin: 6px 0 4px; }
.rec .title .weeks { font-weight: 500; color: var(--muted); font-size: 18px; }
.rec .facts { display: flex; gap: 28px; flex-wrap: wrap; margin: 18px 0 6px; }
.rec .fact .k { font-size: 12px; color: var(--muted); }
.rec .fact .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.score { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
/* lock strip */
.locks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.lock { border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; background: var(--panel); }
.lock .w { font-size: 12px; color: var(--muted); }
.lock .h { font-weight: 650; font-variant-numeric: tabular-nums; }
.lock.past { background: var(--line-soft); color: var(--faint); border-color: var(--line-soft); }
.lock.past .w, .lock.past .h { color: var(--faint); font-weight: 500; }
.lock.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.lock.pick { background: var(--accent-soft); }
/* matrix */
table.matrix td, table.matrix th { text-align: center; }
table.matrix td.lbl, table.matrix th.lbl { text-align: left; }
.mcell { display: block; border-radius: 8px; padding: 8px 6px; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.mcell.best { border-color: var(--accent); font-weight: 700; }
.mcell .s { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
/* group bars */
.gbars { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 1fr; gap: 10px 20px; align-items: center; }
.gbars .hd { font-size: 12px; color: var(--muted); }
.hbar { position: relative; height: 22px; background: var(--line-soft); border-radius: 6px; }
.hbar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.hbar .fill { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; background: var(--accent); opacity: .75; }
.hbar .fill.neg { background: var(--bad); }
.hbar .lab { position: absolute; top: 0; white-space: nowrap; line-height: 22px; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text); }
/* ranked table */
.ticks { letter-spacing: 2px; white-space: nowrap; }
.spread { display: block; font-size: 11px; color: var(--faint); }
tr.best td { background: #f7faff; }
tr.expand td { background: var(--bg); padding: 16px 20px 20px; }
.dec { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px; margin-bottom: 10px; }
.dec .hd { font-weight: 600; margin-bottom: 4px; }
/* status grid */
table.grid { width: auto; }
table.grid td, table.grid th { padding: 0; border: 0; }
table.grid th { padding: 6px 2px; text-align: center; }
table.grid th.pname, table.grid td.pname { text-align: left; padding: 2px 14px 2px 10px; white-space: nowrap; position: sticky; left: 0; background: var(--panel); z-index: 1; }
table.grid th.pname { z-index: 3; }
table.grid tr.grp td { padding: 14px 10px 4px; font-weight: 600; font-size: 12px; color: var(--muted); position: sticky; left: 0; background: var(--panel); }
.cell { display: block; width: 44px; height: 26px; margin: 2px; border-radius: 6px; font-size: 11px; line-height: 26px; text-align: center; cursor: pointer; font-variant-numeric: tabular-nums; position: relative; border: 2px solid transparent; }
.cell:hover { outline: 2px solid var(--text); outline-offset: -1px; }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.diff { border-color: var(--text); }
.cell.split { overflow: hidden; }
.cell.split span { display: block; height: 11px; line-height: 11px; }
.st-main { background: var(--s-main); color: var(--s-main-t); }
.st-second { background: var(--s-second); color: var(--s-second-t); }
.st-dormant { background: var(--s-dormant); color: var(--s-dormant-t); }
.st-left { background: var(--s-left); color: var(--s-left-t); }
.st-none { background: var(--s-none); color: var(--muted); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
/* drawer */
#scrim { position: fixed; inset: 56px 0 0 0; background: rgba(31, 35, 40, .08); z-index: 29; display: none; }
#scrim.open { display: block; }
#drawer { position: fixed; top: 56px; right: 0; bottom: 0; width: min(760px, 96vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(31, 35, 40, .06); overflow: auto; padding: 20px 26px 48px; z-index: 30; display: none; }
#drawer.open { display: block; }
#drawer .close { position: sticky; top: 0; float: right; }
.traits { display: grid; grid-template-columns: max-content 120px max-content; gap: 6px 12px; align-items: center; font-size: 12.5px; }
.tbar { height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
.tbar > div { height: 100%; background: var(--accent); }
.timeline .row { display: grid; grid-template-columns: 50px 120px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; }
svg text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
svg .axis { stroke: var(--line-soft); }
svg .tgt { stroke: var(--bad); stroke-dasharray: 4 3; opacity: .7; }
.md { line-height: 1.6; }
.md table { width: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
.md th { position: static; }
.md h1 { font-size: 20px; } .md h2 { font-size: 16px; margin-top: 28px; } .md h3 { font-size: 14px; }
.md blockquote { margin: 8px 0; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.diffmark td { background: var(--warn-bg); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
@media (max-width: 860px) {
  header { padding: 0 14px; gap: 14px; }
  main { padding: 20px 16px 60px; }
  .two { grid-template-columns: 1fr; }
  .locks { grid-template-columns: repeat(5, 1fr); }
  .gbars { grid-template-columns: 1fr 1fr; } .gbars .gname { grid-column: 1 / -1; }
  .charts { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <span class="brand">TALP</span>
  <nav id="nav"></nav>
  <button class="ghost" id="refresh" title="Dosyaları yeniden oku">Yenile</button>
</header>
<main id="main"><p class="muted">Yükleniyor…</p></main>
<div id="scrim" data-close></div>
<aside id="drawer"></aside>
<script>
"use strict";
// ------------------------------------------------------------ helpers
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = encodeURIComponent;
const cache = new Map();
async function api(path) {
  if (cache.has(path)) return cache.get(path);
  const p = fetch(path, { cache: "no-store" }).then(async (r) => {
    const j = await r.json().catch(() => ({ error: "bad JSON" }));
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  });
  cache.set(path, p);
  p.catch(() => cache.delete(path));
  return p;
}
const fmtNum = (v, d = 0) => v == null || v === "" || Number.isNaN(+v) ? "–" : Number(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtUsd = (v) => v == null ? "–" : "$" + (Math.abs(v) >= 1e9 ? fmtNum(v / 1e9, 2) + "B" : Math.abs(v) >= 1e5 ? fmtNum(v / 1e6, 2) + "M" : Math.abs(v) >= 1e4 ? fmtNum(v / 1e3, 0) + "k" : fmtNum(v));
const fmtPp = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + fmtNum(Math.abs(v), d) + " pp";
const fmtTime = (t) => { if (!t) return "–"; const d = new Date(t * 1000); return d.toLocaleDateString("tr-TR") + " " + d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }); };
const STATUSES = ["main bank", "second bank", "dormant", "left"];
const stClass = (s) => ({ "main bank": "st-main", "second bank": "st-second", "dormant": "st-dormant", "left": "st-left" }[s] || "st-none");
const MONEY_MARK = { "kept": "", "moved some": "↓", "moved most": "↓↓" };
const GOALS = [
  ["goal_1", "Aktif müşteri", "%", 2],
  ["goal_2", "Mevduat", "%", 2],
  ["goal_3", "App Store puanı", "★", 2],
  ["goal_3b", "CFPB şikayet/ay", "", 0],
];
const DEFAULT_TARGETS = { goal_1: ">= 98", goal_2: ">= 97", goal_3: ">= 4.3", goal_3b: "<= 240" };
function goalOk(key, v, targets) {
  if (v == null) return null;
  const t = (targets || {})[key] || DEFAULT_TARGETS[key];
  const m = /^(>=|<=)\s*([\d.]+)/.exec(t || ""); if (!m) return null;
  return m[1] === ">=" ? v >= +m[2] : v <= +m[2];
}
const goalCls = (k, v, t) => { const o = goalOk(k, v, t); return o == null ? "" : o ? "g-good" : "g-bad"; };
const tgtText = (t, k) => String((t || DEFAULT_TARGETS)[k] || "").replace(">=", "≥").replace("<=", "≤");
const PROBE_Q = {
  "1a": ["Güven", "How much do you trust Cobalt Bank?"],
  "1b": ["Güven (b)", "\"I can count on Cobalt Bank to treat me right.\""],
  "2a": ["Kalma", "How likely are you to keep using Cobalt Bank over the next three months?"],
  "2b": ["Ayrılmayı düşünme", "\"I am thinking about leaving Cobalt Bank.\"", true],
  "3a": ["Tavsiye", "How likely are you to recommend Cobalt Bank to a friend or colleague?"],
  "3b": ["Tavsiye (b)", "If a friend asked you about Cobalt Bank today, what would you tell them?"],
  "4a": ["Adillik", "How fairly has Cobalt Bank treated you?"],
  "4b": ["Haksızlık", "\"Cobalt Bank takes advantage of people like me.\"", true],
};
const TRAITS = ["anxiety", "patience", "rumor_belief", "talkativeness", "rate_sensitivity", "financial_literacy"];
const TRAIT_TR = { anxiety: "kaygı", patience: "sabır", rumor_belief: "söylentiye inanma", talkativeness: "konuşkanlık", rate_sensitivity: "faiz hassasiyeti", financial_literacy: "finans bilgisi" };
const GROUP_TR = { "everyday customers": "Günlük müşteriler", "paycheck customers": "Maaş müşterileri", "savers with large balances": "Yüksek bakiyeli tasarrufçular", "small business owners with a Cobalt card reader": "Kart okuyuculu küçük işletmeler", "students": "Öğrenciler" };
const groupTr = (g) => GROUP_TR[g] || g;
const go = (h) => { if (location.hash !== h) location.hash = h; else render(); };
const setMain = (html) => { $("#main").innerHTML = html; };
const isShare = (s) => s && String(s).trim() && !/^nothing\.?$/i.test(String(s).trim()) && !/^none\.?$/i.test(String(s).trim());
const targetText = (t) => typeof t === "string" ? t : JSON.stringify(t);
const shortAction = (a) => String(a.action || "").replace(" during the migration", "").replace(" to other banks", "").replace(", new money only", " (yeni para)") + (a.level && a.level !== "on" ? ` ${a.level}` : "");

// ------------------------------------------------------------ route
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  return raw ? raw.split("/").map(decodeURIComponent) : [];
}
const compareSel = new Set();
const NAV = [["oneri", "Karar önerisi"], ["runs", "Run'lar"], ["compare", "Karşılaştır"], ["logs", "Loglar"], ["docs", "Belgeler"]];
const NAV_EXTRA = `<a href="/algorithms.html">Algoritmalar</a>`;

async function render() {
  const r = parseHash();
  const view = r[0] || "oneri";
  const navKey = view === "run" ? "runs" : view;
  $("#nav").innerHTML = NAV.map(([k, t]) => `<a href="#/${k}" class="${navKey === k ? "on" : ""}">${t}</a>`).join("") + NAV_EXTRA;
  closeDrawer(false);
  try {
    if (view === "oneri") await viewAdvice(r[1]);
    else if (view === "runs") await viewRuns();
    else if (view === "run") await viewRun(r[1], r[2] || "ozet", r.slice(3));
    else if (view === "compare") await viewCompare(r[1], r[2]);
    else if (view === "logs") await viewLogs(r[1], r.slice(2));
    else if (view === "docs") await viewDocs(r[1]);
    else setMain(`<p>Bilinmeyen sayfa.</p>`);
  } catch (e) {
    setMain(`<div class="err">Hata: ${esc(e.message)}</div>`);
  }
}

// ------------------------------------------------------------ drawer
function openDrawer(html) { const d = $("#drawer"); d.innerHTML = `<button class="close" data-close>Kapat</button>` + html; d.classList.add("open"); $("#scrim").classList.add("open"); d.scrollTop = 0; }
function closeDrawer(nav = true) {
  const d = $("#drawer"); if (!d.classList.contains("open")) return;
  d.classList.remove("open"); $("#scrim").classList.remove("open");
  if (nav && d.dataset.back) { const b = d.dataset.back; d.dataset.back = ""; go(b); }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(true); });
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) { closeDrawer(true); return; }
  const g = e.target.closest("[data-go]");
  if (g && !e.target.closest("input,button:not([data-go]),a[href]")) { go(g.dataset.go); }
});
$("#refresh").addEventListener("click", () => { cache.clear(); render(); });
window.addEventListener("hashchange", render);

// ------------------------------------------------------------ lock times
// Week N starts at 13:00 + 30 min x (N-1), local time today; a decision for week N must be locked before that.
function weekStart(n) { const d = new Date(); d.setHours(13, 0, 0, 0); d.setMinutes(d.getMinutes() + 30 * (n - 1)); return d; }
const hhmm = (d) => d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
function lockStrip(picked = []) {
  const now = new Date();
  const next = Array.from({ length: 10 }, (_, i) => i + 1).find((n) => weekStart(n) > now);
  const cells = Array.from({ length: 10 }, (_, i) => {
    const n = i + 1, past = weekStart(n) <= now;
    return `<div class="lock ${past ? "past" : ""} ${n === next ? "next" : ""} ${picked.includes(n) ? "pick" : ""}" title="${n}. hafta ${hhmm(weekStart(n))}'da başlar; kararı bundan önce kilitle">
      <div class="w">${n}. hafta</div><div class="h">${hhmm(weekStart(n))}</div></div>`;
  }).join("");
  const msg = next ? `Sıradaki kilit: <b>${next}. hafta</b> için ${hhmm(weekStart(next))}'dan önce.` : `Kilit kapandı (17:30'dan sonra karar kilitlenemez).`;
  return `<div class="bar" style="margin-top:0"><span class="small muted">Şimdi <b style="color:var(--text)">${hhmm(now)}</b> · ${msg}</span><span class="spacer"></span><span class="small faint">Gri = kilit saati geçti · mavi zemin = önerilen kararların haftası</span></div><div class="locks">${cells}</div>`;
}

// ------------------------------------------------------------ advice (landing)
const openVariants = new Set();
function ticks(met) { return `<span class="ticks">${GOALS.map(([k, l]) => met[k] == null ? `<span class="faint" title="${l}">·</span>` : met[k] ? `<span class="g-good" title="${l}: tuttu">✓</span>` : `<span class="g-bad" title="${l}: tutmadı">✗</span>`).join("")}</span>`; }
function goalStat(g, k, d, targets) {
  if (!g || g.mean == null) return "–";
  const sp = g.n > 1 && g.max - g.min > 1e-9 ? `<span class="spread">${fmtNum(g.min, d)}–${fmtNum(g.max, d)}</span>` : "";
  return `<span class="${goalCls(k, g.mean, targets)}">${fmtNum(g.mean, d)}</span>${sp}`;
}
function decisionCards(decs) {
  if (!decs || !decs.length) return `<div class="muted small">Karar yok (iş her zamanki gibi).</div>`;
  return decs.map((d, i) => `<div class="dec"><div class="hd">${i + 1}. karar · ${esc(d.week)}. hafta · hedef: ${esc(targetText(d.target))}</div>
    <div class="small">${(d.actions || []).map((a) => `${esc(a.action)} <span class="muted">(${esc(a.level)})</span>`).join(" · ")}</div>
    <div class="small muted" style="margin-top:8px">Mesaj · ${(d.message || "").length} karakter · ${esc((d.channels || []).join(", "))}</div>
    <pre>${esc(d.message)}</pre><div class="small muted">Neden</div><pre>${esc(d.why)}</pre></div>`).join("");
}
function groupBars(best, base) {
  const names = Object.keys(best.groups || {});
  if (!names.length || !base) return `<div class="muted small">Grup verisi yok.</div>`;
  const rows = names.map((n) => {
    const b = (base.groups || {})[n] || {}, x = best.groups[n];
    return { n, da: x.active != null && b.active != null ? x.active - b.active : null, dd: x.deposits != null && b.deposits != null ? x.deposits - b.deposits : null, x };
  });
  const max = Math.max(1, ...rows.flatMap((r) => [Math.abs(r.da || 0), Math.abs(r.dd || 0)]));
  const bar = (v) => {
    if (v == null) return `<div class="hbar"><div class="mid"></div></div>`;
    const w = Math.abs(v) / max * 36;
    const left = v >= 0 ? 50 : 50 - w;
    const lab = v >= 0 ? `left:calc(${50 + w}% + 6px)` : `right:calc(${50 + w}% + 6px)`;
    return `<div class="hbar"><div class="mid"></div><div class="fill ${v < 0 ? "neg" : ""}" style="left:${left}%;width:${w}%"></div><span class="lab" style="${lab}">${fmtPp(v)}</span></div>`;
  };
  return `<div class="gbars"><div></div><div class="hd">Aktif müşteri (baza göre)</div><div class="hd">Mevduat (baza göre)</div>
    ${rows.map((r) => `<div class="gname"><div>${esc(groupTr(r.n))}</div><div class="small faint">${fmtNum(r.x.customers)} müşteri · ${fmtUsd(r.x.deposits_usd)}</div></div>${bar(r.da)}${bar(r.dd)}`).join("")}</div>`;
}
function matrixHtml(mx) {
  const all = mx.rows.flatMap((r) => Object.values(r.cells).map((c) => c.gap_total)).filter((v) => v != null);
  const lo = Math.min(...all), hi = Math.max(...all);
  const shade = (v) => v == null ? "transparent" : `rgba(47, 111, 222, ${(0.05 + 0.3 * (hi > lo ? (hi - v) / (hi - lo) : 1)).toFixed(3)})`;
  return `<div class="tablewrap"><table class="matrix"><thead><tr><th class="lbl">Plan · oynatılan karar</th>${mx.weeks.map((w) => `<th>${w}. hafta</th>`).join("")}</tr></thead><tbody>
    ${mx.rows.map((r) => `<tr><td class="lbl"><b>${esc(r.label)}</b><div class="small muted">${r.decision}. karar · en iyi: ${r.best_week ? r.best_week + ". hafta" : "–"}</div></td>
      ${mx.weeks.map((w) => { const c = r.cells[w]; return `<td>${c ? `<span class="mcell ${w === r.best_week ? "best" : ""}" style="background:${shade(c.gap_total)}" title="${esc(c.variant)}">${c.met_count}/4<span class="s">açık ${fmtNum(c.gap_total, 1)}${c.spread ? " · oynama " + fmtNum(c.spread, 1) : ""}</span></span>` : `<span class="faint">–</span>`}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div><div class="small muted" style="margin-top:8px">Hücre = tutan hedef sayısı ve toplam hedef açığı (puan). Koyu = daha iyi; çerçeve = o planın en iyi haftası.</div>`;
}
function gapChips(v, targets) {
  return GOALS.map(([k, l, , d]) => { const g = v.goals[k]; const ok = v.met[k]; const gap = v.gap[k];
    return `<div class="fact"><div class="k">${l} <span class="faint">${esc(tgtText(targets, k))}</span></div><div class="v ${ok == null ? "" : ok ? "g-good" : "g-bad"}">${fmtNum(g.mean, k === "goal_3b" ? 0 : d)}</div><div class="small muted">${ok ? "tuttu" : gap != null ? "açık " + fmtNum(gap, 1) + " puan" : "–"}${v.delta && v.delta[k] != null ? ` · baza göre ${k === "goal_3b" ? (v.delta[k] > 0 ? "+" : "") + fmtNum(v.delta[k], 0) : k === "goal_3" ? (v.delta[k] > 0 ? "+" : "") + fmtNum(v.delta[k], 2) : fmtPp(v.delta[k])}` : ""}</div></div>`; }).join("");
}
function recCard(S, ranked, base) {
  const rec = S.recommendation;
  const chosen = ranked.find((v) => v.variant === rec.variant);
  const byScore = ranked.find((v) => v.variant === rec.best_by_score);
  const eq = ranked.filter((v) => rec.equivalent.includes(v.variant) && v.variant !== chosen.variant);
  const late = chosen.decisions.map((d, i) => [i + 1, d.week]).filter(([, w]) => weekStart(w) <= new Date());
  let honesty = "";
  if (rec.no_gain) honesty += `<div class="note"><b>Karar vermek kararsız kalmaktan daha iyi değil.</b> Kararsız baz da en az bu kadar hedef tutuyor; bütçeyi harcamadan önce bir kez daha bak.</div>`;
  if (eq.length) honesty += `<div class="note"><b>Eşdeğer planlar var:</b> ${eq.map((v) => `${esc(v.label)} (${fmtUsd(v.cost)})`).join(", ")} aynı sayıda hedef tutuyor ve açık farkı seed oynamasından (${fmtNum(rec.noise, 1)} puan) küçük. ${chosen.variant !== byScore.variant ? `Puanda ${esc(byScore.label)} önde, ama fark gürültü içinde olduğu için ucuz olan öneriliyor.` : "Ucuz olan öneriliyor."}</div>`;
  if (rec.single_seed) honesty += `<div class="note">Tek seed'li varyant var: gürültü ölçülemedi, sonucu temkinli oku.</div>`;
  const lateNote = late.length ? `<div class="note">Kilit saati geçti: ${late.map(([i, w]) => `${i}. karar (${w}. hafta, ${hhmm(weekStart(w))})`).join(", ")}. En erken kilitlenebilir hafta için zamanlama sweep'ine bak.</div>` : "";
  return `<div class="rec">
    <div class="eyebrow">Öneri · ${esc(S.name)}</div>
    <div class="title">${esc(chosen.label)} <span class="weeks">(${chosen.decisions.map((d, i) => `${i + 1}. karar ${d.week}. hafta`).join(", ")})</span></div>
    <div class="muted small">${chosen.decisions.map((d) => (d.actions || []).map(shortAction).join(" + ")).map((t, i) => `${i + 1}: ${esc(t)}`).join(" · ")}</div>
    <div class="facts">
      <div class="fact"><div class="k">Tutan hedef</div><div class="v">${chosen.met_count}/4</div><div class="small muted">toplam açık ${fmtNum(chosen.gap_total, 1)} puan</div></div>
      <div class="fact"><div class="k">Maliyet</div><div class="v">${fmtUsd(chosen.cost)}</div><div class="small muted">bütçe $4.0M</div></div>
      ${gapChips(chosen, S.targets)}
    </div>
    ${honesty}${lateNote}
    <div class="bar" style="margin-bottom:0"><button class="primary" data-toggle="${esc(chosen.variant)}">${openVariants.has(chosen.variant) ? "Kararları gizle" : "Kararları göster"}</button>
      ${base ? `<span class="small muted">Baz: kararsız run, ${base.seeds.length} seed · ${base.met_count}/4 hedef · açık ${fmtNum(base.gap_total, 1)} puan</span>` : ""}</div>
    ${openVariants.has(chosen.variant) ? `<div style="margin-top:14px">${decisionCards(chosen.decisions)}</div>` : ""}
  </div>`;
}

    return;
  }
  const sel = name && L.sweeps.some((s) => s.name === name) ? name : L.default;
  const S = await api(`/api/sweep?name=${enc(sel)}`);
  const ranked = S.variants.filter((v) => !v.baseline), base = S.variants.find((v) => v.baseline);
  const best = ranked[0];
  const picker = L.sweeps.length > 1 ? `<label class="small muted">Sweep <select id="swsel">${L.sweeps.map((s) => `<option value="${esc(s.name)}" ${s.name === sel ? "selected" : ""}>${esc(s.name)} · ${s.variants} varyant${s.timing ? " · zamanlama" : ""}</option>`).join("")}</select></label>` : `<span class="small muted">Sweep: ${esc(sel)}</span>`;

      <td class="small" style="min-width:260px">${v.decisions.length ? v.decisions.map((d) => `<div style="margin-bottom:4px"><b>${esc(d.week)}. hf</b> · ${esc((d.actions || []).map(shortAction).join(" + "))}</div>`).join("") : '<span class="muted">karar yok</span>'}</td>
      <td class="num">${fmtUsd(v.cost)}</td>
      ${GOALS.map(([k, , , d]) => `<td class="num">${goalStat(v.goals[k], k, k === "goal_3b" ? 0 : d === 2 && k !== "goal_3" ? 1 : 2, S.targets)}</td>`).join("")}
      <td class="num"><b>${fmtNum(v.gap_total, 1)}</b>${v.gap_spread ? `<span class="spread">oynama ${fmtNum(v.gap_spread, 1)}</span>` : ""}</td>
</tr>`;
    const exp = open ? `<tr class="expand"><td colspan="9"><div class="two"><div>${decisionCards(v.decisions)}</div><div>
      ${base && !v.baseline ? `<div class="box"><h3 style="margin-top:0">Gruplara etkisi</h3>${groupBars(v, base)}</div>` : ""}
      <div class="box small"><h3 style="margin-top:0">Run'lar</h3>${Object.entries(v.runs).map(([s, id]) => `<div><a href="#/run/${enc(id)}">seed ${esc(s)}</a></div>`).join("")}</div>
      </div></div></td></tr>` : "";
    return row + exp;
  }).join("");
  setMain(`<div class="bar" style="margin:0 0 4px"><h1 style="margin:0">Karar önerisi</h1><span class="spacer"></span>${picker}</div>

    ${top}
    <h2>Kilit saatleri</h2>${lockStrip(picked)}

    <h2>Tüm varyantlar</h2>

      ${GOALS.map(([k, l]) => `<th class="num" title="hedef ${esc(tgtText(S.targets, k))}">${l}<div class="faint" style="font-weight:400">${esc(tgtText(S.targets, k))}</div></th>`).join("")}
      <th class="num">Hedef açığı<div class="faint" style="font-weight:400">puan, 0 = hepsi tuttu</div></th></tr></thead><tbody>${rows}</tbody></table></div>

    ${chosenV && base ? `<h2>Önerilen planın gruplara etkisi <span class="small muted" style="font-weight:400">(${esc(chosenV.label)} − kararsız baz, 10. hafta)</span></h2><div class="card">${groupBars(chosenV, base)}</div>` : ""}`);
  document.querySelectorAll("[data-toggle]").forEach((el) => el.addEventListener("click", (e) => {

// ------------------------------------------------------------ charts (inline SVG)
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function lineChart({ title, series, yMin, yMax, target, unit = "", height = 220 }) {
  const W = 460, H = height, L = 44, R = 12, T = 12, B = 26;
  const xs = (w) => L + (w - 1) * (W - L - R) / 9;
  const all = series.flatMap((s) => s.points.map((p) => p[1])).filter((v) => v != null);
  if (yMin == null) yMin = Math.min(...all, target ?? Infinity); if (yMax == null) yMax = Math.max(...all, target ?? -Infinity);
  if (!isFinite(yMin) || !isFinite(yMax)) return `<div class="card"><b>${esc(title)}</b><div class="muted small">Veri yok.</div></div>`;
  if (yMax - yMin < 1e-9) { yMin -= 1; yMax += 1; }
  const step = niceStep((yMax - yMin) / 4);
  yMin = Math.floor(yMin / step) * step; yMax = Math.ceil(yMax / step) * step;
  if (yMax - yMin < step * 2) yMax += step;
  const ys = (v) => T + (yMax - v) * (H - T - B) / (yMax - yMin);
  const dec = step < 0.1 ? 2 : step < 1 ? 1 : 0;
  let g = "";
  for (let v = yMin; v <= yMax + step / 2; v += step) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${fmtNum(v, dec)}</text>`;
  for (let w = 1; w <= 10; w++) g += `<text x="${xs(w)}" y="${H - 8}" text-anchor="middle">${w}</text>`;
  if (target != null) g += `<line class="tgt" x1="${L}" x2="${W - R}" y1="${ys(target)}" y2="${ys(target)}"/><text x="${W - R}" y="${ys(target) - 4}" text-anchor="end" style="fill:var(--bad)">hedef ${target}${unit}</text>`;
  for (const s of series) {
    const pts = s.points.filter((p) => p[1] != null);
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${pts.map((p) => `${xs(p[0])},${ys(p[1])}`).join(" ")}"/>`;
    g += pts.map((p) => `<circle cx="${xs(p[0])}" cy="${ys(p[1])}" r="3" fill="${s.color}"><title>${esc(s.name)} · hf ${p[0]}: ${fmtNum(p[1], 2)}${unit}</title></circle>`).join("");
  }
  const leg = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="card"><b>${esc(title)}</b>${leg}<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg></div>`;
}
function stackedBars({ title, weeks, keys, colors, height = 220 }) {
  const W = 460, H = height, L = 36, R = 12, T = 12, B = 26;
  const max = (() => { const m = Math.max(1, ...weeks.map((w) => keys.reduce((s, k) => s + (w[k] || 0), 0))); const st = niceStep(m / 4); return Math.max(st, Math.ceil(m / st) * st); })();
  const bw = (W - L - R) / 10;
  const ys = (v) => T + (max - v) * (H - T - B) / max;
  let g = "";
  const bst = niceStep(max / 4);
  for (let v = 0; v <= max + bst / 2; v += bst) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  weeks.forEach((w, i) => {
    let acc = 0; const x = L + i * bw + bw * 0.18;
    keys.forEach((k, j) => { const v = w[k] || 0; if (!v) return; g += `<rect x="${x}" width="${bw * 0.64}" y="${ys(acc + v)}" height="${ys(acc) - ys(acc + v)}" fill="${colors[j]}"><title>hf ${i + 1} · ${esc(k)}: ${v}</title></rect>`; acc += v; });
    g += `<text x="${x + bw * 0.32}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`;
  });
  return `<div class="card"><b>${esc(title)}</b><div class="legend">${keys.map((k, j) => `<span><i style="background:${colors[j]}"></i>${esc(k)}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg></div>`;
}
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function tgtNum(t, k) { const m = /([\d.]+)/.exec((t || {})[k] || ""); return m ? +m[1] : null; }

    ${stackedBars({ title: "Şikayetler (persona sayısı)", weeks: cmp, keys: ["bank", "cfpb"], colors: [cssVar("--s-second"), cssVar("--s-left")] })}
  </div>
  <h2>Haftalık aksiyonlar</h2>

  ${Object.entries(acts).sort((a, b) => b[1].reduce((x, y) => x + y) - a[1].reduce((x, y) => x + y)).map(([a, v]) => `<tr><td>${esc(a)}</td>${v.map((n) => `<td class="num ${n ? "" : "faint"}">${n || "·"}</td>`).join("")}<td class="num"><b>${v.reduce((x, y) => x + y)}</b></td></tr>`).join("")}

    ${Object.keys(dt).length ? `<h2>Karar hedefleri</h2><div class="kv small">${Object.entries(dt).map(([k, v]) => `<div>${esc(k)}</div><div>${esc(v.join(", "))} <span class="muted">(${v.length})</span></div>`).join("")}</div>` : ""}
    <h2>Ağızdan ağıza <span class="small muted" style="font-weight:400">(${ms.length})</span></h2>${soc}`;
}

// ------------------------------------------------------------ compare
async function viewCompare(a, b) {
  if (!a || !b) {
    const d = await api("/api/runs");
    const opts = d.runs.map((x) => `<option value="${esc(x.id)}">${esc(x.id)}</option>`).join("");
    setMain(`<h1>Karşılaştır</h1><p class="lead">İki run seç.</p><div class="bar"><select id="ca" style="max-width:420px">${opts}</select><select id="cb" style="max-width:420px">${opts}</select><button class="primary" id="cgo">Karşılaştır</button></div>`);
    if (d.runs[1]) $("#cb").value = d.runs[1].id;
    $("#cgo").addEventListener("click", () => go(`#/compare/${enc($("#ca").value)}/${enc($("#cb").value)}`));
    return;
  }
  const [A, B] = await Promise.all([api(`/api/run?id=${enc(a)}`), api(`/api/run?id=${enc(b)}`)]);
  const ma = A.metrics || {}, mb = B.metrics || {};
  const metr = GOALS.map(([k, lbl, , dd]) => { const x = ma[k], y = mb[k]; const dl = x != null && y != null ? y - x : null; return `<tr><td>${lbl} <span class="faint small">${esc(tgtText(A.targets, k))}</span></td><td class="num ${goalCls(k, x, A.targets)}">${fmtNum(x, dd)}</td><td class="num ${goalCls(k, y, B.targets)}">${fmtNum(y, dd)}</td><td class="num">${dl == null ? "–" : (dl > 0 ? "+" : "") + fmtNum(dl, dd)}</td></tr>`; }).join("");
  const ser = (D, k) => ((D.weekly_metrics || {}).weeks || []).map((w) => [w.week, w[k] ?? null]);
  const c1 = cssVar("--c1"), c2 = cssVar("--c2");
  const la = "A: " + (A.run.name || a), lb = "B: " + (B.run.name || b);
  const da = A.run.decisions || [], db = B.run.decisions || [];
  const n = Math.max(da.length, db.length);
  let ddiff = "";
  if (!n) ddiff = `<div class="muted small">İki run'da da karar yok.</div>`;
  for (let i = 0; i < n; i++) {
    const x = da[i], y = db[i];
    const fields = ["week", "target", "actions", "channels", "message", "why"];
    const fmt = (dec, f) => dec ? (f === "actions" ? (dec.actions || []).map((q) => `${q.action} (${q.level})`).join("; ") : Array.isArray(dec[f]) ? dec[f].join(", ") : typeof dec[f] === "object" ? JSON.stringify(dec[f]) : dec[f]) : "—";
    ddiff += `<details class="box"><summary>${i + 1}. karar</summary><table><thead><tr><th>Alan</th><th>A</th><th>B</th></tr></thead><tbody>${fields.map((f) => { const u = fmt(x, f), v = fmt(y, f); return `<tr class="${String(u) !== String(v) ? "diffmark" : ""}"><td class="small muted">${f}</td><td class="small" style="white-space:pre-wrap">${esc(u)}</td><td class="small" style="white-space:pre-wrap">${esc(v)}</td></tr>`; }).join("")}</tbody></table></details>`;
  }
  const WA = indexWeekly(A.weekly), WB = indexWeekly(B.weekly);
  const pids = A.personas.map((p) => p.id).filter((pid) => B.personas.some((q) => q.id === pid));
  let ndiff = 0, rows = "";
  for (const g of groupsOf(A.personas)) {
    const ps = A.personas.filter((p) => p.group === g && pids.includes(p.id));
    if (!ps.length) continue;
    rows += `<tr class="grp"><td colspan="11">${esc(groupTr(g))}</td></tr>`;
    for (const p of ps) {
      rows += `<tr><td class="pname">${esc(p.id)} <span class="small muted">${esc(p.name || "")}</span></td>`;
      for (let w = 1; w <= 10; w++) {
        const x = (WA[p.id] || {})[w], y = (WB[p.id] || {})[w];
        const diff = (x && x.status) !== (y && y.status) || (x && x.money) !== (y && y.money);
        if (diff) ndiff++;
        rows += `<td><span class="cell split ${diff ? "diff" : ""}" style="cursor:default" title="hf ${w}\nA: ${esc(x ? x.status + " / " + x.money : "–")}\nB: ${esc(y ? y.status + " / " + y.money : "–")}"><span class="${x ? stClass(x.status) : "st-none"}">${x ? MONEY_MARK[x.money] || "" : ""}</span><span class="${y ? stClass(y.status) : "st-none"}">${y ? MONEY_MARK[y.money] || "" : ""}</span></span></td>`;
      }
      rows += "</tr>";
    }
  }
  setMain(`<h1>Karşılaştır</h1>
    <div class="small" style="margin-bottom:20px"><b>A</b> <a href="#/run/${enc(a)}">${esc(a)}</a> <span class="muted">· ${esc(A.run.type)} · seed ${esc(A.run.seed)}</span><br><b>B</b> <a href="#/run/${enc(b)}">${esc(b)}</a> <span class="muted">· ${esc(B.run.type)} · seed ${esc(B.run.seed)}</span></div>
    <div class="tablewrap" style="display:inline-block"><table style="width:auto"><thead><tr><th>Hedef</th><th class="num">A</th><th class="num">B</th><th class="num">B − A</th></tr></thead><tbody>${metr}</tbody></table></div>
    <h2>Haftalar</h2><div class="charts">
      ${lineChart({ title: "Aktif müşteri %", series: [{ name: la, color: c1, points: ser(A, "goal_1") }, { name: lb, color: c2, points: ser(B, "goal_1") }], target: tgtNum(A.targets, "goal_1"), unit: "%" })}
      ${lineChart({ title: "Mevduat %", series: [{ name: la, color: c1, points: ser(A, "goal_2") }, { name: lb, color: c2, points: ser(B, "goal_2") }], target: tgtNum(A.targets, "goal_2"), unit: "%" })}
    </div>
    <h2>Kararlar <span class="small muted" style="font-weight:400">A ${fmtUsd(A.budget.total)} · B ${fmtUsd(B.budget.total)}</span></h2>${ddiff}
    <h2>Persona × hafta <span class="small muted" style="font-weight:400">üst yarı A, alt yarı B · ${ndiff} farklı hücre</span></h2>
    ${legendHtml()}
    <div class="tablewrap" style="display:inline-block;max-width:100%;margin-top:10px"><table class="grid"><thead><tr><th class="pname">Persona</th>${Array.from({ length: 10 }, (_, i) => `<th>${i + 1}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`);
}

// ------------------------------------------------------------ logs (calls.jsonl attempts)
const lf = { persona: "", week: "", round: "", failed: false, q: "" };
async function viewLogs(run, rest) {
  if (!run) {
    const d = await api("/api/logs");
    setMain(`<h1>Loglar</h1><p class="lead">Motor her model denemesini run'ın calls.jsonl dosyasına yazar (valid / attempt / error_type).</p><div class="tablewrap"><table><thead><tr><th>Run</th><th>Model</th><th class="num">Deneme</th><th class="num">Geçersiz</th><th class="num">Tekrar</th><th class="num">Ort. ms</th><th>Hatalar</th></tr></thead><tbody>
    ${d.runs.map((s) => `<tr class="click" data-go="#/logs/${enc(s.run)}"><td><a href="#/logs/${enc(s.run)}">${esc(s.run)}</a><div class="small faint">${esc(s.type)} · seed ${esc(s.seed)}${s.complete === false ? ` · <span class="g-bad">tamamlanmadı ${esc(s.failure_type || "")}</span>` : ""} · ${fmtTime(s.mtime)}</div></td><td class="small">${esc(s.models.join(", "))}</td><td class="num">${fmtNum(s.calls)}</td><td class="num ${s.failed ? "g-bad" : ""}">${fmtNum(s.failed)}</td><td class="num">${fmtNum(s.retries)}</td><td class="num">${fmtNum(s.avg_ms)}</td><td class="small">${esc(Object.entries(s.errors).map(([k, v]) => `${k} ${v}`).join(", "))}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">Run yok.</td></tr>`}
    </tbody></table></div>`);
    return;
  }
  const L = await api(`/api/log?run=${enc(run)}&q=${enc(lf.q)}`);
  const calls = L.calls.filter((c) => (!lf.persona || String(c.persona) === lf.persona) && (!lf.week || String(c.week) === lf.week) && (!lf.round || String(c.round) === lf.round) && (!lf.failed || c.valid === false));
  const LIM = 500;
  const sel = (k, opts, lbl) => `<select data-lf="${k}"><option value="">${lbl}: hepsi</option>${opts.map((o) => `<option value="${esc(o)}" ${String(o) === String(lf[k]) ? "selected" : ""}>${lbl}: ${esc(o)}</option>`).join("")}</select>`;
  const uniq = (k) => [...new Set(L.calls.map((c) => c[k]).filter((x) => x != null))].sort((a, b) => (typeof a === "number" ? a - b : String(a).localeCompare(String(b))));
  const fail = L.calls.filter((c) => c.valid === false).length;
  setMain(`<div class="small"><a href="#/logs">← Loglar</a></div><h1 style="margin-top:8px">${esc(run)}</h1>
    <div class="bar" style="margin-top:16px"><span><b>${fmtNum(L.calls.length)}</b> deneme</span><span class="${fail ? "g-bad" : "muted"}">· ${fail} geçersiz</span><span class="muted">· <a href="#/run/${enc(run)}">run sayfası</a></span></div>
    <div class="bar">${sel("persona", uniq("persona"), "Persona")}${sel("week", uniq("week"), "Hafta")}${sel("round", uniq("round"), "Tur")}
      <label class="small"><input type="checkbox" id="lffail" ${lf.failed ? "checked" : ""}> yalnız geçersiz</label>
      <input type="search" id="lfq" placeholder="Prompt/yanıtta ara (Enter)" value="${esc(lf.q)}" style="min-width:220px">
      <span class="small muted">${calls.length} deneme${calls.length > LIM ? `, ilk ${LIM}` : ""}</span></div>
    <div class="tablewrap tall"><table><thead><tr><th>Persona</th><th class="num">Hf</th><th class="num">Tur</th><th class="num">Deneme</th><th>Durum</th><th>Model</th><th class="num">ms</th></tr></thead><tbody>
    ${calls.slice(0, LIM).map((c) => `<tr class="click" data-go="#/logs/${enc(run)}/${enc(c.id)}"><td>${esc(c.persona ?? "–")}</td><td class="num">${esc(c.week ?? "–")}</td><td class="num">${esc(c.round ?? "–")}</td><td class="num">${esc(c.attempt ?? "–")}</td><td>${c.valid !== false ? '<span class="badge good">ok</span>' : `<span class="badge bad">${esc(c.error_type || "hata")}</span> <span class="small faint">${esc(c.error_stage || "")}</span>`}</td><td class="small">${esc(c.model)}</td><td class="num">${fmtNum((c.elapsed_seconds || 0) * 1000)}</td></tr>`).join("")}
    </tbody></table></div>`);
  document.querySelectorAll("[data-lf]").forEach((el) => el.addEventListener("change", () => { lf[el.dataset.lf] = el.value; viewLogs(run, []); }));
  $("#lffail").addEventListener("change", (e) => { lf.failed = e.target.checked; viewLogs(run, []); });
  $("#lfq").addEventListener("keydown", (e) => { if (e.key === "Enter") { lf.q = e.target.value; viewLogs(run, []); } });
  if (rest[0]) {
    $("#drawer").dataset.back = `#/logs/${enc(run)}`;
    try {
      const c = await api(`/api/call?run=${enc(run)}&id=${enc(rest[0])}`);
      const meta = ["persona", "week", "round", "attempt", "valid", "error_type", "error_stage", "model", "seed", "elapsed_seconds"];
      openDrawer(`<h2 style="margin-top:0" class="mono">${esc(c.id)}</h2>
        <div class="kv small">${meta.map((k) => `<div>${k}</div><div>${esc(c[k] ?? "–")}</div>`).join("")}</div>
        <h3 style="margin-top:24px">Yanıt</h3><pre>${esc(c.response)}</pre>
        <details open><summary>Prompt (${(c.prompt || "").length} karakter)</summary><pre>${esc(c.prompt)}</pre></details>`);
    } catch (e) { openDrawer(`<div class="err">${esc(e.message)}</div>`); }
  }
}

// ------------------------------------------------------------ docs + markdown
function inlineMd(s) {
  let t = esc(s);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, href) => /^https?:/.test(href) ? `<a href="${href}" target="_blank" rel="noopener noreferrer">${txt}</a>` : `${txt} <span class="muted small">(${href})</span>`);
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let out = "", i = 0;
  const isTable = (l) => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(l);
    if (h) { const n = Math.min(h[1].length + 1, 6); out += `<h${n}>${inlineMd(h[2])}</h${n}>`; i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (isTable(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const hd = cells(l); i += 2; const body = [];
      while (i < lines.length && isTable(lines[i])) body.push(cells(lines[i++]));
      out += `<div class="tablewrap" style="margin:10px 0"><table><thead><tr>${hd.map((c) => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, "")); out += `<blockquote>${md(buf.join("\n"))}</blockquote>`; continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d+[.)]/.test(l); const items = [];
      while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
        if (m) items.push({ ind: m[1].length, text: m[3] }); else items[items.length - 1].text += " " + lines[i].trim();
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out += `<${tag}>${items.map((it) => `<li style="margin-left:${Math.floor(it.ind / 2) * 18}px">${inlineMd(it.text)}</li>`).join("")}</${tag}>`;
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i]) && !isTable(lines[i])) buf.push(lines[i++]);
    out += `<p>${inlineMd(buf.join(" "))}</p>`;
  }
  return out;
}
async function viewDocs(name) {
  const [C, D] = await Promise.all([api("/api/config"), api("/api/docs")]);
  const docs = Object.keys(D.docs).filter((n) => D.docs[n] != null);
  const tab = name || "plan";
  const tabs = `<div class="tabs"><a href="#/docs/plan" class="${tab === "plan" ? "on" : ""}">plan.json</a><a href="#/docs/candidates" class="${tab === "candidates" ? "on" : ""}">Aday kararlar</a><a href="#/docs/surprises" class="${tab === "surprises" ? "on" : ""}">Sürprizler</a>${docs.map((n) => `<a href="#/docs/${enc(n)}" class="${tab === n ? "on" : ""}">${esc(n.replace(".md", ""))}</a>`).join("")}</div>`;
  let body = "";
  if (tab === "plan") {
    body = C.plan == null ? `<div class="note">code/config/decisions/plan.json yok veya okunamadı.</div>` :
      `<p class="lead">code/config/decisions/plan.json, şu anki hali.</p>${decisionsHtml(C.plan, C.plan_budget)}<details><summary>Ham JSON</summary><pre>${esc(JSON.stringify(C.plan, null, 2))}</pre></details>`;
  } else if (tab === "candidates") {
    body = (C.candidates || []).length ? C.candidates.map((c) => `<h2>${esc(c.file)}</h2>${Array.isArray(c.data) ? decisionsHtml(c.data, c.budget) : '<div class="err">Okunamadı.</div>'}`).join("") : `<div class="card empty">code/config/decisions/candidates/ boş.</div>`;
  } else if (tab === "surprises") {
    body = C.surprises.length ? C.surprises.map((s) => { const x = s.data || {}; return `<div class="box"><div class="bar" style="margin:0 0 6px"><b>${esc(x.title || s.file)}</b><span class="badge">${esc(x.week)}. hafta</span></div><pre>${esc(x.text)}</pre>${x.update ? `<div class="small muted">Güncelleme · ${esc(x.update.week)}. hafta</div><pre>${esc(x.update.text)}</pre>` : ""}<div class="small faint mono">${esc(s.file)}</div></div>`; }).join("") : `<div class="card empty">Henüz dashboard duyurusu yok.</div>`;
  } else if (D.docs[tab] != null) body = `<div class="card md">${md(D.docs[tab])}</div>`;
  else body = `<div class="note">docs/${esc(tab)} yok.</div>`;
  setMain(`<h1>Belgeler</h1>${tabs}${body}`);
}

render();
</script>
